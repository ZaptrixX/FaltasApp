<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faltas</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#161616;--mute:#80868b;--line:#e6e6e6;--ok:#2f9e6b;--warn:#c27c00;--bad:#d4382c;--track:#ececec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1a1a1a;--ink:#ececec;--mute:#8b9096;--line:#2a2a2a;--ok:#4cc38a;--warn:#f0a93a;--bad:#ff6b5e;--track:#2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--card:#1a1a1a;--ink:#ececec;--mute:#8b9096;--line:#2a2a2a;--ok:#4cc38a;--warn:#f0a93a;--bad:#ff6b5e;--track:#2a2a2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 110px}
h1{font-size:1.2rem;margin:0}
.rules{color:var(--mute);font-size:.78rem;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:flex-end}
.top .n{flex:1;min-width:0}.top .h{width:84px}
small{display:block;color:var(--mute);font-size:.72rem;margin-bottom:2px}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;width:100%}
textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.8rem;min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
.n input{font-weight:600;font-size:1.1rem}
.x{font:inherit;border:0;background:none;color:var(--mute);font-size:1.4rem;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px}
.x.arm{color:#fff;background:var(--bad);font-size:.8rem}
.ctrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px}
.ctr button{font:inherit;font-size:1.5rem;line-height:1;width:44px;height:44px;border:0;border-radius:9px;background:var(--bg);color:var(--ink);cursor:pointer;touch-action:manipulation}
.ctr button:active{background:var(--track)}
.ctr .v{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:1.5ch;text-align:center}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-6px;margin-bottom:12px}
.cap span{font-size:.72rem;color:var(--mute);text-align:center}
.lims{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lim .t{font-size:.72rem;color:var(--mute)}
.lim .v{font-size:.85rem}
.lim .v b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.lim .p{font-size:.72rem;color:var(--mute);font-variant-numeric:tabular-nums}
.lim.hit .v{color:var(--bad);font-weight:600}
.bar{position:relative;height:4px;background:var(--track);border-radius:2px;margin:14px 0 4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:2px;width:0;transition:width .2s}
.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.tick{position:absolute;left:60%;top:-3px;bottom:-3px;width:1px;background:var(--mute)}
.state{font-size:.8rem;color:var(--mute);min-height:1.1em}
.state.warn{color:var(--warn)}.state.bad{color:var(--bad)}
.bar-bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;cursor:pointer;touch-action:manipulation}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1;max-width:320px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:1.05rem;margin:0 0 4px}.panel h3{font-size:.9rem;margin:18px 0 6px}
.panel p{color:var(--mute);font-size:.82rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.msg{font-size:.82rem;min-height:1.2em;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Faltas</h1>
  <div class="rules">1ª hora = 7/6 · otras = 5/6 · apercibimiento 6 % · pérdida 10 %</div>
  <div id="list"></div>
</main>
<div class="bar-bottom">
  <button class="btn pri" id="add" type="button">Añadir asignatura</button>
  <button class="btn" id="csv" type="button">CSV</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <h2>Copia de seguridad (CSV)</h2>
    <p>Mismo formato que la versión de escritorio. Puedes pasar los datos entre el móvil y el ordenador.</p>
    <h3>Exportar</h3>
    <div class="row"><button class="btn" id="save" type="button">Guardar archivo</button><button class="btn" id="copy" type="button">Copiar texto</button></div>
    <textarea id="out" readonly></textarea>
    <h3>Importar</h3>
    <div class="row"><button class="btn" id="pick" type="button">Elegir archivo</button><input type="file" id="file" accept=".csv,text/csv,text/plain" hidden></div>
    <textarea id="inp" placeholder="…o pega aquí el contenido del CSV"></textarea>
    <div class="row"><button class="btn" id="rep" type="button">Reemplazar actuales</button><button class="btn" id="app" type="button">Añadir a las actuales</button></div>
    <div class="msg" id="msg"></div>
    <div class="row"><button class="btn" id="close" type="button">Cerrar</button></div>
  </div>
</div>

<script>
(function(){
  var W1=7/6,W2=5/6,KEY="faltas-ciclo-v1",HEAD="asignatura;horas;faltas_1a_hora;faltas_otras";
  var subjects=[],list=document.getElementById("list"),dl=null;
  function $(id){return document.getElementById(id);}
  function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(Array.isArray(p))return p;}}catch(e){}return[];}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(subjects));}catch(e){}}
  function fmt(n){return(Math.round(n*100)/100).toLocaleString("es-ES",{maximumFractionDigits:2});}
  function num(v){v=parseFloat(v);return isFinite(v)&&v>0?v:0;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fit(rem,w){return rem<=1e-9?0:Math.max(0,Math.ceil(rem/w-1e-9)-1);}

  function ctr(k,v){return '<div class="ctr"><button type="button" data-act="dec" data-k="'+k+'" aria-label="Quitar una">−</button><span class="v" data-o="'+k+'">'+v+'</span><button type="button" data-act="inc" data-k="'+k+'" aria-label="Añadir una">+</button></div>';}
  function lim(id,t){return '<div class="lim" data-o="'+id+'"><div class="t">'+t+'</div><div class="v"></div><div class="p"></div></div>';}
  function cardHTML(s){
    return '<div class="top"><div class="n"><small>Asignatura</small><input type="text" data-f="name" placeholder="Nombre" value="'+esc(s.name)+'"></div>'+
      '<div class="h"><small>Horas</small><input type="number" min="0" step="1" inputmode="decimal" data-f="hours" value="'+(s.hours||"")+'"></div>'+
      '<button class="x" type="button" data-act="del" aria-label="Eliminar asignatura">×</button></div>'+
      '<div class="ctrs">'+ctr("first",Math.floor(num(s.first)))+ctr("other",Math.floor(num(s.other)))+'</div>'+
      '<div class="cap"><span>faltas 1ª hora</span><span>faltas otras horas</span></div>'+
      '<div class="lims">'+lim("warn","Hasta apercibimiento")+lim("lose","Hasta pérdida")+'</div>'+
      '<div class="bar"><div class="fill" data-o="fill"></div><div class="tick"></div></div><div class="state" data-o="state"></div>';
  }
  function setLim(el,rem,eq,limit){
    var v=el.querySelector(".v"),p=el.querySelector(".p");el.classList.remove("hit");
    if(!limit){v.textContent="—";p.textContent="";return;}
    if(rem>1e-9)v.innerHTML='<b>'+fit(rem,W1)+'</b> de 1ª · <b>'+fit(rem,W2)+'</b> de otras';
    else{v.textContent="Alcanzado";el.classList.add("hit");}
    p.textContent=fmt(eq)+" / "+fmt(limit);
  }
  function refresh(card,s){
    var h=num(s.hours),a=Math.floor(num(s.first)),b=Math.floor(num(s.other)),eq=a*W1+b*W2,warn=h*.06,lose=h*.10;
    var q=function(n){return card.querySelector('[data-o="'+n+'"]');};
    q("first").textContent=a;q("other").textContent=b;
    setLim(q("warn"),warn-eq,eq,warn);setLim(q("lose"),lose-eq,eq,lose);
    var f=q("fill"),st=q("state");f.className="fill";st.className="state";
    if(!h){f.style.width="0";st.textContent="Introduce las horas totales";return;}
    f.style.width=Math.min(100,eq/lose*100)+"%";st.textContent="";
    if(eq>=lose-1e-9){f.classList.add("bad");st.classList.add("bad");st.textContent="Pierdes la evaluación";}
    else if(eq>=warn-1e-9){f.classList.add("warn");st.classList.add("warn");st.textContent="Apercibido";}
  }
  function render(){
    list.innerHTML="";
    if(!subjects.length){list.innerHTML='<div class="empty">Aún no hay asignaturas. Añade la primera.</div>';return;}
    subjects.forEach(function(s){
      var card=document.createElement("section");card.className="card";card.innerHTML=cardHTML(s);
      card.addEventListener("input",function(e){var f=e.target.getAttribute("data-f");if(!f)return;s[f]=e.target.value;refresh(card,s);save();});
      card.addEventListener("click",function(e){
        var t=e.target.closest("[data-act]");if(!t)return;var act=t.getAttribute("data-act");
        if(act==="del"){
          if(!t.classList.contains("arm")){t.classList.add("arm");t.textContent="¿Seguro?";setTimeout(function(){t.classList.remove("arm");t.textContent="×";},3000);return;}
          subjects.splice(subjects.indexOf(s),1);save();render();return;
        }
        var k=t.getAttribute("data-k");s[k]=Math.max(0,Math.floor(num(s[k]))+(act==="inc"?1:-1));refresh(card,s);save();
      });
      list.appendChild(card);refresh(card,s);
    });
  }

  // ---- CSV ----
  function toCsv(){return HEAD+"\n"+subjects.map(function(s){
    return String(s.name||"").replace(/[;\r\n]/g," ").trim()+";"+num(s.hours)+";"+Math.floor(num(s.first))+";"+Math.floor(num(s.other));
  }).join("\n")+"\n";}
  function parse(txt){
    var out=[];txt=String(txt).replace(/^\uFEFF/,"");
    txt.split(/\r?\n/).forEach(function(l){
      if(!l.trim()||/^asignatura/i.test(l))return;
      var p=l.split(";");if(p.length<4)return;
      var h=parseFloat(p[1].replace(",",".")),a=parseInt(p[2],10),b=parseInt(p[3],10);
      if(isNaN(h)||isNaN(a)||isNaN(b))return;
      out.push({name:p[0].trim(),hours:Math.max(0,h),first:Math.max(0,a),other:Math.max(0,b)});
    });
    return out;
  }
  function msg(t,bad){var m=$("msg");m.textContent=t;m.style.color=bad?"var(--bad)":"var(--ok)";}
  function doImport(replace){
    var d=parse($("inp").value);
    if(!d.length){msg("No hay asignaturas válidas en el texto.",true);return;}
    subjects=replace?d:subjects.concat(d);save();render();$("out").value=toCsv();
    msg("Importadas "+d.length+" asignaturas.");$("inp").value="";
  }

  $("add").addEventListener("click",function(){
    subjects.push({name:"",hours:"",first:0,other:0});save();render();
    var n=list.querySelectorAll('[data-f="name"]');if(n.length){var l=n[n.length-1];l.scrollIntoView({block:"center"});l.focus();}
  });
  $("csv").addEventListener("click",function(){$("out").value=toCsv();msg("");$("sheet").hidden=false;});
  $("close").addEventListener("click",function(){$("sheet").hidden=true;});
  $("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))$("sheet").hidden=true;});
  $("copy").addEventListener("click",function(){
    var t=toCsv(),o=$("out");o.value=t;
    function fb(){o.select();try{document.execCommand("copy")?msg("Copiado."):msg("Selecciona el texto y cópialo a mano.",true);}catch(e){msg("Selecciona el texto y cópialo a mano.",true);}}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg("Copiado.");},fb);else fb();
  });
  $("save").addEventListener("click",function(){
    if(!dl)return;
    dl.save({filename:"faltas.csv",data:"\uFEFF"+toCsv()}).then(function(){msg("Archivo guardado.");},function(e){msg(e&&e.code==="declined"?"Guardado cancelado.":"No se pudo guardar. Usa Copiar texto.",true);});
  });
  $("pick").addEventListener("click",function(){$("file").value="";$("file").click();});
  $("file").addEventListener("change",function(){
    var f=$("file").files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){$("inp").value=String(r.result);msg("Archivo cargado: elige Reemplazar o Añadir.");};
    r.readAsText(f,"utf-8");
  });
  $("rep").addEventListener("click",function(){doImport(true);});
  $("app").addEventListener("click",function(){doImport(false);});

  $("save").hidden=true;
  try{if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(d){if(d){dl=d;$("save").hidden=false;}},function(){});}}catch(e){}

  subjects=load();
  if(!subjects.length)subjects=[{name:"",hours:"",first:0,other:0}];
  render();
})();
</script>
</body>
</html>
